<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tl;dr playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abel&family=Candal&family=Alexandria:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" type="text/css" href="playground.css">
</head>
<body>

<nav class="nav">
    <div class="container nav_inner">
        <a href="index.html" class="nav_brand">
            <img src="icon.svg" alt="tl-dr" class="icon-md">
            <span>tldr</span>
        </a>
        <div class="nav_links">
            <a href="index.html#empty-state">Professional</a>
            <a href="index.html#rupaul-mode">Fabulous</a>
            <a href="index.html#trump-mode">Tremendous</a>
            <a href="index.html#settings">Customize</a>
            <a href="playground.html">Playground</a>
        </div>
    </div>
</nav>

<div class="playground-container">
    <div class="browser-window">
        <div class="browser-header">
            <div class="browser-dots">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>
            <div class="address-bar" contenteditable="true" id="addressBar">tl-dr.store</div>
            <img src="icon.svg" alt="tl;dr" class="icon-xs">
        </div>
        <div class="browser-content">
            <!-- Left side: Text area -->
            <div class="web-page">
                <textarea id="mainInput" class="main-textarea" placeholder="Paste text or article URL here..."></textarea>
            </div>
            
            <!-- Right side: tl;dr Sidebar -->
            <div class="tldr-sidebar-fixed">
                <div class="sidebar-header" style="padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--gray);">
                    <div class="header-brand" style="display: flex; align-items: center; gap: 10px;">
                        <img src="icon.svg" alt="tl;dr" style="width: 24px;">
                        tl;dr
                    </div>
                </div>
                
                <!-- Tone Tabs -->
                <div style="display: flex; margin: 16px 16px 0 16px; background: var(--gray-light); padding: 4px; border-radius: 12px; gap: 4px;">
                    <button class="mode-tab active" data-tone="tone1" style="flex: 1; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--yellow); border: none; border-radius: 10px; cursor: pointer; font-family: 'Abel', sans-serif;">
                        <span class="material-symbols-outlined" style="color: white;">speaker_notes</span>
                        <span style="font-size: 11px; color: white;">Professional</span>
                    </button>
                    <button class="mode-tab" data-tone="tone2" style="flex: 1; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: transparent; border: none; border-radius: 10px; cursor: pointer; font-family: 'Abel', sans-serif;">
                        <span class="material-symbols-outlined" style="color: #94a3b8;">crown</span>
                        <span style="font-size: 11px; color: var(--dark);">RuPaul</span>
                    </button>
                    <button class="mode-tab" data-tone="tone3" style="flex: 1; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: transparent; border: none; border-radius: 10px; cursor: pointer; font-family: 'Abel', sans-serif;">
                        <span class="material-symbols-outlined" style="color: #94a3b8;">fort</span>
                        <span style="font-size: 11px; color: var(--dark);">Trump</span>
                    </button>
                </div>
                
                <!-- Summary Content -->
                <div id="summaryContent" class="summary-scroll">
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 200px; text-align: center; color: #94a3b8;">
                        <img src="icon.svg" alt="tl;dr" style="width: 48px; margin-bottom: 16px; opacity: 0.6;">
                        <p>Paste text or a URL above</p>
                    </div>
                </div>
                
                <!-- Footer Actions -->
                <div style="padding: 12px 16px; border-top: 1px solid var(--gray); display: flex; gap: 8px;">
                    <button id="copyBtn" style="flex: 1; background: var(--gray-light); border: 1px solid var(--gray); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 36px;">
                        <span class="material-symbols-outlined" style="color: var(--blue);">content_copy</span>
                    </button>
                    <button id="refreshBtn" style="flex: 1; background: var(--gray-light); border: 1px solid var(--gray); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 36px;">
                        <span class="material-symbols-outlined" style="color: var(--blue);">refresh</span>
                    </button>
                    <div style="flex: 1; position: relative;">
                        <button id="langBtn" style="width: 100%; background: var(--gray-light); border: 1px solid var(--gray); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 36px;">
                            <span class="material-symbols-outlined" style="color: var(--blue);">g_translate</span>
                        </button>
                        <div id="langMenu" style="display: none; position: absolute; bottom: 100%; left: 0; margin-bottom: 8px; background: var(--white); border: 1px solid var(--gray); border-radius: 10px; min-width: 160px; z-index: 100;">
                            <a href="#" data-lang="english" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; text-decoration: none; color: var(--dark);">🇺🇸 English</a>
                            <a href="#" data-lang="arabic" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; text-decoration: none; color: var(--dark);">🇸🇦 العربية</a>
                            <a href="#" data-lang="spanish" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; text-decoration: none; color: var(--dark);">🇪🇸 Español</a>
                            <a href="#" data-lang="italian" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; text-decoration: none; color: var(--dark);">🇮🇹 Italiano</a>
                            <a href="#" data-lang="french" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; text-decoration: none; color: var(--dark);">🇫🇷 Français</a>
                        </div>
                    </div>
                    <button id="settingsBtn" style="flex: 1; background: var(--gray-light); border: 1px solid var(--gray); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 36px;">
                        <span class="material-symbols-outlined" style="color: var(--blue);">settings</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast-message">Copied!</div>

<script type="text/javascript" src="playground.js"></script>
</body>
</html>
